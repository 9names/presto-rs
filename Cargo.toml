[package]
name = "presto-rp2350-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
# dependencies for the binary
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }

byte-slice-cast = { version = "1.2.2", default-features = false }
critical-section = "1.2.0"
cyw43 = { version = "0.3.0" }
cyw43-pio = { version = "0.4.0", features = ["defmt"] }
embassy-executor = { version = "0.7.0", features = [
    "arch-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",

] }
embassy-net = { version = "0.7.0", features = [
    "defmt",
    "tcp",
    "udp",
    "raw",
    "dhcpv4",
    "medium-ethernet",
    "dns",
] }
embassy-net-wiznet = { version = "0.2.0", features = ["defmt"] }
embassy-rp = { version = "0.4.0", features = [
    "rp235xb",
    "binary-info",
    "defmt",
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
] }
embassy-sync = { version = "0.7.0", features = ["defmt"] }
embassy-time = { version = "0.4.0", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embedded-graphics = "0.8.1"

fixed = "1.28.0"
libm = "0.2.11"
pio = "0.3.0"
pio-proc = "0.3.0"
smart-leds = "0.4.0"
static_cell = "2.1"


[patch.crates-io]
cyw43 = { git = "https://github.com/embassy-rs/embassy", rev = "94f9b2707486ca3eade5bf4b237edf3d6aa90f35" }
cyw43-pio = { git = "https://github.com/embassy-rs/embassy", rev = "94f9b2707486ca3eade5bf4b237edf3d6aa90f35" }
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy", rev = "94f9b2707486ca3eade5bf4b237edf3d6aa90f35" }
embassy-net = { git = "https://github.com/embassy-rs/embassy", rev = "94f9b2707486ca3eade5bf4b237edf3d6aa90f35" }
embassy-net-wiznet = { git = "https://github.com/embassy-rs/embassy", rev = "94f9b2707486ca3eade5bf4b237edf3d6aa90f35" }
embassy-rp = { git = "https://github.com/embassy-rs/embassy", rev = "94f9b2707486ca3eade5bf4b237edf3d6aa90f35" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "94f9b2707486ca3eade5bf4b237edf3d6aa90f35" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "94f9b2707486ca3eade5bf4b237edf3d6aa90f35" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "94f9b2707486ca3eade5bf4b237edf3d6aa90f35" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "94f9b2707486ca3eade5bf4b237edf3d6aa90f35" }

# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 1
overflow-checks = true
lto = "off"

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false

# do not optimize proc-macro crates = faster builds from scratch
[profile.dev.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[profile.release.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 's'
overflow-checks = true

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'